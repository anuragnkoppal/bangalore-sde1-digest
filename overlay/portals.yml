  positive:
    - word:Java
    - Spring Boot
    - SpringBoot
    - Spring Framework
  negative:
    - 3-4 years
    - 3 to 4 years
    - 4+ years
    - 4+ yrs
    - Minimum 5 year
    - Minimum 4 year
    - 4-6 years
    - 4-7 years
    - 4-8 years
    - 4 to 8 years
