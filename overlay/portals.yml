    - SDE III
    - SDE-3
    - SDE3
    - SDE IV
    - Engineer III
    - III
    - Senior
    - Sr.
    - SDET
    - in Test
    - Embedded
    - Level 5
    - Level 6
    - L5
    - L6
    - L7
    - Engineering Manager
    - Data Scientist
    - Data Analyst
    - Product Manager
    - DevOps
    - SRE
    - 'QA '
    - Quality Assurance
    - Test Engineer
    - Support Engineer
    - Sales
    - 4 to 8 years
    - 4-8 years
    - 4+ Years
    - 4+ years
    - 5+ years
    - 8+ Years
    - 8+ years
