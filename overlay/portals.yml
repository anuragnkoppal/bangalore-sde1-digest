# Bangalore SDE-1 scanner for Anurag N Koppal
# Expanded: curated live boards + official career-ops GH/Lever/Ashby list + IBM/JPMC.
# Digest also scans currently-hiring YC companies via overlay/scripts/scan-yc-hiring.mjs
# (Greenhouse, Lever, Ashby) so names you have not heard of can still surface.
# career-ops never auto-submits.

scan_history:
  recheck_after_days: 21
  dedup_include_location: true
max_posting_age_days: 7
skip_tiers:
  - intern
location_filter:
  always_allow:
    - Bangalore
    - Bengaluru
    - Bengalooru
  allow:
    - Bangalore
    - Bengaluru
    - Bengalooru
    - Karnataka
    - Remote - India
    - Remote, India
    - India Remote
  block:
    - Mumbai
    - Delhi
    - New Delhi
    - Noida
    - Gurgaon
    - Gurugram
    - Hyderabad
    - Chennai
    - Pune
    - Kolkata
    - Ahmedabad
    - United States
    - USA
    - United Kingdom
    - London
    - San Francisco
    - New York
    - Seattle
    - Austin
    - Germany
    - Singapore
    - Canada
    - Australia
title_filter:
  positive:
    - Software Engineer
    - Software Development Engineer
    - Software Developer
    - SDE
    - SDE 1
    - SDE I
    - SDE-1
    - SDE1
